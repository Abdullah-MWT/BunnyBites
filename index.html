    <script>
      // Fix for browser extensions (e.g. Urban VPN) that try to overwrite window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var _fetch = originalFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(val) { _fetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        // Shield app from third-party browser extension content-script errors
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('Cannot set property fetch') !== -1 ||
              event.message.indexOf('fetch of #<Window>') !== -1
            ))
          )) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
